name: 功能建议 / Feature request
description: 分享你希望 TSX 改进的使用体验 / Suggest an improvement to TSX
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        中英文均可。请先搜索相似建议，不要包含私人资料。
        Chinese and English are welcome. Search similar suggestions first and avoid private information.
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / Use case
      description: 你在什么场景下遇到了什么不便？ / What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 期望的改进 / Suggested improvement
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他办法 / Alternatives considered
