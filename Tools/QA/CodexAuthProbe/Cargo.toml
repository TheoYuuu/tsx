[package]
name = "lumax-codex-auth-prototype"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["qa-fixtures"]
qa-fixtures = []

[dependencies]
codex-config = { path = "../../CodexTranslationPrototype/source/codex-36650394c5b38c2990ccf2a3457165ca3e9d9726/codex-rs/config" }
codex-file-system = { path = "../../CodexTranslationPrototype/source/codex-36650394c5b38c2990ccf2a3457165ca3e9d9726/codex-rs/file-system" }
codex-protocol = { path = "../../CodexTranslationPrototype/source/codex-36650394c5b38c2990ccf2a3457165ca3e9d9726/codex-rs/protocol" }
codex-utils-path-uri = { path = "../../CodexTranslationPrototype/source/codex-36650394c5b38c2990ccf2a3457165ca3e9d9726/codex-rs/utils/path-uri" }
base64 = "0.22"
tracing = "0.1"
codex-api = { path = "../../CodexTranslationPrototype/source/codex-36650394c5b38c2990ccf2a3457165ca3e9d9726/codex-rs/codex-api" }
futures = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
codex-login = { path = "../../CodexTranslationPrototype/source/codex-36650394c5b38c2990ccf2a3457165ca3e9d9726/codex-rs/login" }
codex-model-provider = { path = "../../CodexTranslationPrototype/source/codex-36650394c5b38c2990ccf2a3457165ca3e9d9726/codex-rs/model-provider" }
codex-http-client = { path = "../../CodexTranslationPrototype/source/codex-36650394c5b38c2990ccf2a3457165ca3e9d9726/codex-rs/http-client" }
codex-keyring-store = { path = "../../CodexTranslationPrototype/source/codex-36650394c5b38c2990ccf2a3457165ca3e9d9726/codex-rs/keyring-store" }
sha2 = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util", "process"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[profile.dev]
debug = 0
incremental = false

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
